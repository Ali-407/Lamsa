<!-- Top Announcement Bar -->
<aside class="announcement-bar" aria-label="Store announcements">
  <div class="container announcement-content">
    <span>FREE US &amp; INT SHIPPING ON ORDERS OVER $150 &amp; EXCLUSIVE PERFUME SET</span>
  </div>
</aside>

<!-- Main Navigation Header -->
<header class="main-header" [class.scrolled]="isScrolled()">
  <div class="container header-container">
    <!-- Desktop Left Navigation Links -->
    <nav class="desktop-nav" aria-label="Main navigation">
      <ul class="nav-list">
        <li><a routerLink="/" class="nav-link" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">HOME</a></li>
        <li><a routerLink="/products" class="nav-link" routerLinkActive="active">SHOP</a></li>
        <li><a routerLink="/categories" class="nav-link" routerLinkActive="active">CATEGORIES</a></li>
      </ul>
    </nav>

    <!-- Mobile Toggle Button -->
    <button type="button" class="mobile-toggle-btn" (click)="toggleMobileMenu()" aria-label="Toggle navigation menu"
      [attr.aria-expanded]="isMobileMenuOpen()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        @if (isMobileMenuOpen()) {
        <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
        } @else {
        <path d="M4 8h16M4 16h16" stroke-linecap="round" stroke-linejoin="round" />
        }
      </svg>
    </button>

    <!-- Center Brand Logo -->
    <a routerLink="/" class="brand-logo" aria-label="ODORATUS Home">
      <span class="logo-name">ODORATUS</span>
    </a>

    <!-- Action Bar (Search Input + Account + Bag) -->
    <div class="header-actions">
      <!-- Search Bar -->
      <div class="search-box desktop-search">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" placeholder="Search fragrances..." class="search-input" aria-label="Search fragrances">
      </div>



      <!-- Shopping Bag Icon -->
      <button type="button" class="action-btn bag-btn" aria-label="Shopping Bag (0 items)" [routerLink]="['/cart']">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span class="bag-count" *ngIf="cartService.itemCount() > 0">{{ cartService.itemCount() }}</span>
      </button>
    </div>
  </div>

  <!-- Mobile Drawer -->
  @if (isMobileMenuOpen()) {
  <div class="mobile-nav-overlay" (click)="toggleMobileMenu()"></div>
  <div class="mobile-nav-drawer">
    <div class="mobile-search-wrapper">
      <input type="text" placeholder="Search fragrances..." class="mobile-search-input">
    </div>
    <ul class="mobile-nav-list">
      <li><a routerLink="/" (click)="toggleMobileMenu()">HOME</a></li>
      <li><a routerLink="/products" (click)="toggleMobileMenu()">SHOP</a></li>
      <li><a routerLink="/categories" (click)="toggleMobileMenu()">CATEGORIES</a></li>
      <li><a routerLink="/products" (click)="toggleMobileMenu()">ALL PRODUCTS</a></li>
    </ul>
  </div>
  }
</header>
