@if (productService.totalPages() > 1) {
  <nav class="pagination-wrapper" aria-label="Catalog pagination">
    <div class="pagination-controls">
      <!-- Prev Arrow Button -->
      <button 
        type="button" 
        class="pagination-arrow-btn prev-btn"
        [disabled]="productService.currentPage() === 1"
        (click)="onPrev()"
        aria-label="Previous page">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <!-- Page Status Text -->
      <span class="page-status-indicator">
        Page <span class="current-page-num">{{ productService.currentPage() }}</span> of {{ productService.totalPages() }}
      </span>

      <!-- Next Arrow Button (Black square button matching reference design) -->
      <button 
        type="button" 
        class="pagination-arrow-btn next-btn"
        [disabled]="productService.currentPage() === productService.totalPages()"
        (click)="onNext()"
        aria-label="Next page">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
  </nav>
}
